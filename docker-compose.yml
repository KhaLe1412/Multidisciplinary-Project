version: "3.8"

services:
  # ─── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: driersystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      # Không đặt MYSQL_DATABASE ở đây – để file tables.sql tự tạo database DADN
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # Toàn bộ thư mục database/ được mount vào /db_files (không phải entrypoint)
      # để init.sh có thể load từng file theo thứ tự đúng.
      - ./database:/db_files:ro
      # Shell script được mysql entrypoint tự động chạy khi volume trống.
      # Dùng .sh thay vì .sql trực tiếp để đảm bảo DELIMITER $$ hoạt động đúng.
      - ./database/init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (React + Vite → Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Truyền empty string → frontend dùng URL tương đối → nginx proxy tới backend
        VITE_GATEWAY_URL: ""
    container_name: driersystem-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

  # ─── Backend (Python / FastAPI) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driersystem-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: DADN
      DB_USER: root
      DB_PASSWORD: rootpassword
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
