version: "3.8"

services:
  # ─── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: driersystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      # Không đặt MYSQL_DATABASE ở đây – để file tables.sql tự tạo database DADN
    volumes:
      - ./database/tables.sql:/docker-entrypoint-initdb.d/tables.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (React + Vite → Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driersystem-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Backend (Python / FastAPI) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driersystem-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: DADN
      DB_USER: root
      DB_PASSWORD: rootpassword
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
