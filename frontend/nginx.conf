server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Bật gzip để giảm dung lượng tải
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Proxy API calls tới backend service (tránh CORS, ẩn port backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA routing — mọi route đều trả về index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lâu dài cho assets tĩnh (Vite đã hash tên file)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
